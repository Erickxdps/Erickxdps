      <text xml:space="preserve" x="826" y="232"><tspan fill="#A371F7">def</tspan><tspan fill="#d2a8ff"> home</tspan><tspan fill="#c9d1d9">():</tspan></text>
      <text xml:space="preserve" x="850" y="258"><tspan fill="#A371F7">return</tspan><tspan fill="#c9d1d9"> build_solution()</tspan></text>
